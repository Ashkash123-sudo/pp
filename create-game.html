<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Game | Panther Press</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="styles-override.css">
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="index.html"><img src="thumbnail.png" alt="Panther Press"><span><strong>PANTHER</strong><small>PRESS / CFHS ATHLETICS</small></span></a>
    <section class="auth-card">
      <p class="eyebrow">CREATE GAME</p>
      <h1>New game</h1>
      <p id="notice" class="message"></p>
      <form id="gameForm">
        <label>Sport
          <input id="sportInput" list="sportsList" placeholder="Type or choose a sport" autocomplete="off" required>
          <datalist id="sportsList"></datalist>
        </label>
        <label>Team<input id="team" type="text" required placeholder="Carolina Forest"></label>
        <label>Opponent<input id="opponent" type="text" required></label>
        <label>Date<input id="date" type="date" required></label>
        <label>Start time<input id="time" type="time" required></label>
        <label>Venue<input id="venue" type="text"></label>
        <label>Location type
          <select id="homeAway"><option value="home">Home</option><option value="away">Away</option><option value="neutral">Neutral</option></select>
        </label>
        <label>Ticket URL<input id="ticketUrl" type="url" placeholder="https://"></label>
        <label>Game status
          <select id="status"><option value="scheduled">Scheduled</option><option value="postponed">Postponed</option><option value="cancelled">Cancelled</option></select>
        </label>
        <button class="auth-button" type="submit">Create game</button>
      </form>
      <div class="auth-links"><a href="admin-login.html">Back to admin</a><a href="index.html">Home</a></div>
    </section>
  </main>

  <script src="auth-utils.js"></script>
  <script>
    // Only admins allowed
    if (!CFHSAuth || !CFHSAuth.requireAdmin()) {
      document.getElementById('notice').textContent = 'Administrator access required to create games.';
      document.getElementById('gameForm').style.display = 'none';
    }

    const sports = [
      'Football','Basketball','Baseball','Softball','Soccer','Volleyball','Track & Field','Cross Country','Tennis','Golf','Wrestling','Swimming','Lacrosse','Cheer','Gymnastics']

    const datalist = document.getElementById('sportsList');
    sports.forEach(s => { const opt = document.createElement('option'); opt.value = s; datalist.appendChild(opt); });

    // allow typing and matching suggestions from datalist; datalist provides dropdown matches automatically
    document.getElementById('gameForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!CFHSAuth.requireAdmin()) return;
      const game = {
        id: `g_${Date.now()}`,
        sport: document.getElementById('sportInput').value.trim(),
        team: document.getElementById('team').value.trim(),
        opponent: document.getElementById('opponent').value.trim(),
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        venue: document.getElementById('venue').value.trim(),
        location: document.getElementById('homeAway').value,
        ticketUrl: document.getElementById('ticketUrl').value.trim(),
        status: document.getElementById('status').value,
        createdAt: new Date().toISOString()
      };
      const games = JSON.parse(localStorage.getItem('cfhs-games') || '[]');
      games.push(game);
      localStorage.setItem('cfhs-games', JSON.stringify(games));
      alert('Game created. It will appear in the schedule once published.');
      window.location.href = 'admin-login.html';
    });
  </script>
</body>
</html>
