<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Panther Press</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="styles-override.css"></head>
<body>
	<main class="auth-shell">
		<a class="auth-brand" href="index.html"><img src="thumbnail.png" alt="Panther Press"><span><strong>PANTHER</strong><small>PRESS / CFHS ATHLETICS</small></span></a>
		<section class="auth-card">
			<p class="eyebrow">PANTHER PRESS ACCESS</p>
			<h1 id="authTitle">Sign in</h1>
			<p id="authIntro">Sign in to follow teams, save preferences, and personalize your Panthers experience.</p>
			<form id="authForm">
				<label>Email<input id="authEmail" type="email" required placeholder="you@example.com"></label>
				<label>Password<input id="authPassword" type="password" minlength="8" required placeholder="Create or enter password"></label>
				<button class="auth-button" type="submit">Sign in</button>
			</form>
			<p id="authMessage" class="message" role="status"></p>
			<div class="auth-links">
				<button id="toggleMode" type="button">Create account</button>
				<button id="adminLoginBtn" type="button" class="auth-button secondary">Admin login</button>
				<a href="index.html">Continue as guest</a>
			</div>
		</section>
	</main>
	<script src="auth.js"></script>
</body>
</html>
