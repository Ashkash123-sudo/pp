<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Card | Panther Press</title>
  <link rel="icon" type="image/png" href="thumbnail.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sport.css">
  <style>
    :root{--card-red:#c8102e;--card-ink:#14181b;--foil-a:#e6414f;--foil-b:#a5122a;--foil-c:#5c0a17}
    .card-stage{position:relative;min-height:calc(100vh - 76px);display:grid;place-items:center;padding:48px 20px;overflow:hidden;
      background:radial-gradient(1200px 620px at 50% -12%,#fdeaec 0%,var(--paper) 62%)}
    .card-col{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}

    /* ---------- the collectible card ---------- */
    .tc{position:relative;width:min(392px,92vw);aspect-ratio:2.5/3.5;border-radius:20px;padding:15px;
      background:linear-gradient(150deg,var(--foil-a) 0%,var(--foil-b) 42%,#1a1e22 100%);
      box-shadow:0 30px 60px -18px rgba(20,10,12,.55),0 0 0 1px rgba(255,255,255,.08) inset;
      transform:perspective(1100px);transition:transform .12s ease-out}
    .tc::before{content:"";position:absolute;inset:6px;border-radius:15px;border:1px solid rgba(255,255,255,.35);pointer-events:none;z-index:4}
    .tc-holo{position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:3;overflow:hidden}
    .tc-holo::after{content:"";position:absolute;inset:-40%;
      background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 48%,rgba(150,210,255,.35) 52%,transparent 60%);
      mix-blend-mode:overlay;transform:translateX(-30%);animation:holoDrift 6s ease-in-out infinite}
    .tc-inner{position:relative;height:100%;border-radius:11px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;z-index:2}

    .tc-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
      background:var(--card-ink);color:#fff;font:800 12px/1 var(--display);letter-spacing:1.5px;text-transform:uppercase}
    .tc-head span{color:#f4b6be;font:700 9px var(--body);letter-spacing:1.5px}

    .tc-photo{position:relative;flex:1;min-height:0;background:radial-gradient(circle at 50% 30%,#3a4247,#14181b);display:grid;place-items:center;overflow:hidden}
    .tc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .tc-watermark{font:800 190px/1 var(--display);color:rgba(255,255,255,.07);letter-spacing:-6px;user-select:none}
    .tc-emoji{position:absolute;right:-14px;bottom:-22px;font-size:132px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));opacity:.9}

    .tc-ovr{position:absolute;top:10px;left:10px;z-index:3;width:60px;height:64px;display:grid;place-content:center;text-align:center;
      background:linear-gradient(160deg,#fff,#e7dcc6);color:var(--card-ink);
      clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
      box-shadow:0 6px 14px rgba(0,0,0,.4)}
    .tc-ovr strong{font:800 24px/1 var(--display)}
    .tc-ovr span{font:800 8px/1 var(--body);letter-spacing:1.5px;margin-top:2px}
    .tc-pos{position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.92);color:var(--card-ink);
      font:800 10px/1 var(--body);letter-spacing:1.2px;text-transform:uppercase;padding:6px 9px;border-radius:2px}
    .tc-namebar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:26px 14px 12px;
      background:linear-gradient(0deg,rgba(10,12,14,.95) 12%,rgba(10,12,14,.55) 60%,transparent);color:#fff}
    .tc-namebar h1{font:800 clamp(26px,7vw,34px)/.9 var(--display);text-transform:uppercase;margin:0}
    .tc-namebar p{margin:5px 0 0;font:700 9px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:#f4b6be}

    .tc-stats{background:var(--paper);padding:11px 14px 8px}
    .tc-stats .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid rgba(20,24,27,.1)}
    .tc-stats .row:last-child{border-bottom:0}
    .tc-stats .k{font:700 9px var(--body);letter-spacing:1px;text-transform:uppercase;color:#6c7472}
    .tc-stats .v{font:800 16px var(--display);color:var(--card-ink);white-space:nowrap}
    .tc-stats .empty{font-size:11px;color:#8b9190;padding:8px 0}
    .tc-foot{background:var(--card-ink);color:#8b9a9a;font:700 8px var(--body);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:6px}

    .tc-bio{width:min(392px,92vw);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font:600 11px var(--body);color:#5b6160;text-transform:uppercase;letter-spacing:.6px}
    .tc-bio b{color:var(--ink)}
    .card-note{font-size:12px;color:#8b9190}
    .card-note a{color:var(--red);text-decoration:underline}

    /* ---------- pack open sequence ---------- */
    .card-col.sealed .tc,.card-col.sealed .tc-bio,.card-col.sealed .card-note{visibility:hidden}

    .fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
    .rays{position:fixed;left:50%;top:calc(50% + 8px);width:120vmax;height:120vmax;z-index:45;pointer-events:none;
      transform:translate(-50%,-50%) scale(0);opacity:0;
      background:repeating-conic-gradient(from 0deg,rgba(255,220,150,.35) 0 6deg,transparent 6deg 16deg)}
    .rays.go{animation:rays 1s ease-out forwards}

    .backdrop{position:fixed;inset:0;z-index:44;background:rgba(8,6,8,0);pointer-events:none;transition:background .45s ease}
    .backdrop.dim{background:rgba(8,6,8,.66)}
    .card-stage.shake{animation:stageShake .5s ease-in-out}

    .pack{position:fixed;left:50%;top:calc(50% + 16px);transform:translate(-50%,-50%);z-index:50;
      width:min(332px,84vw);aspect-ratio:2.5/3.6;cursor:pointer;animation:packIdle 3.6s ease-in-out infinite;
      filter:drop-shadow(0 0 0 rgba(255,120,140,0))}
    .pack-glow{position:absolute;inset:-16%;z-index:-1;border-radius:40px;
      background:radial-gradient(circle,rgba(255,90,120,.55),rgba(255,90,120,0) 68%);opacity:.5;animation:glowPulse 3.6s ease-in-out infinite}
    .pack-foil{position:absolute;inset:0;border-radius:13px;overflow:hidden;
      background:linear-gradient(140deg,var(--foil-a) 0%,var(--foil-b) 48%,var(--foil-c) 100%);
      box-shadow:0 34px 70px -20px rgba(20,10,12,.6),inset 0 0 0 2px rgba(255,255,255,.16)}
    .pack-foil::after{content:"";position:absolute;inset:-40%;
      background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.6) 47%,rgba(150,210,255,.4) 52%,rgba(255,220,150,.35) 55%,transparent 63%);
      mix-blend-mode:overlay;animation:foilSheen 2.6s linear infinite}
    .pack-l{clip-path:inset(0 49.5% 0 0);transform-origin:right center}
    .pack-r{clip-path:inset(0 0 0 49.5%);transform-origin:left center}
    .pack-strip{position:absolute;left:-2px;right:-2px;top:0;height:24px;z-index:4;background:#7d0c1c;
      -webkit-mask:linear-gradient(-45deg,#000 33%,transparent 0) 0 0/16px 16px repeat-x;
      mask:linear-gradient(-45deg,#000 33%,transparent 0) 0 0/16px 16px repeat-x;box-shadow:0 6px 14px rgba(0,0,0,.4)}
    .tear{position:absolute;left:0;top:24px;height:4px;width:0;z-index:6;opacity:0;
      background:linear-gradient(90deg,transparent,#fff,#ffd98a,#fff,transparent);box-shadow:0 0 14px 3px rgba(255,235,180,.9)}
    .pack-face{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px;text-align:center}
    .pack-logo{width:132px;height:98px;background:#fff;
      -webkit-mask:url('thumbnail.png') center/contain no-repeat;mask:url('thumbnail.png') center/contain no-repeat;
      filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
    .pack-word{font:800 25px/1 var(--display);letter-spacing:4px;color:#fff}
    .pack-sub{font:700 9px var(--body);letter-spacing:2px;color:#f7c9cf}
    .pack-hint{position:absolute;left:0;right:0;bottom:20px;z-index:3;font:700 10px var(--body);letter-spacing:2px;color:#fff;
      text-align:center;animation:hintPulse 1.4s ease-in-out infinite}

    .pack.charge{animation:packCharge .48s ease-in-out}
    .pack.charge .pack-glow{opacity:1;animation:none}
    .pack.rip .pack-face,.pack.rip .pack-hint{animation:faceGone .3s forwards}
    .pack.rip .pack-strip{animation:stripFly .55s cubic-bezier(.3,0,.2,1) forwards}
    .pack.rip .tear{animation:tearRip .34s ease-out forwards}
    .pack.rip .pack-l{animation:peelL .24s ease-in forwards}
    .pack.rip .pack-r{animation:peelR .24s ease-in forwards}
    .pack.blow .pack-l{animation:blowL .6s cubic-bezier(.25,.55,.2,1) forwards}
    .pack.blow .pack-r{animation:blowR .6s cubic-bezier(.25,.55,.2,1) forwards}

    .flash{position:fixed;left:50%;top:50%;width:16px;height:16px;border-radius:50%;z-index:55;transform:translate(-50%,-50%);
      background:radial-gradient(circle,#fff,rgba(255,235,200,.6) 30%,rgba(255,255,255,0) 70%);opacity:0}
    .flash.go{animation:flash .55s ease-out forwards}
    .shockwave{position:fixed;left:50%;top:calc(50% + 8px);width:40px;height:40px;border-radius:50%;z-index:46;
      transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);opacity:0}
    .shockwave.go{animation:shock .62s ease-out forwards}
    .confetti{position:absolute;left:50%;top:50%;width:9px;height:14px;border-radius:2px;opacity:0;
      animation:confetti 1s cubic-bezier(.15,.6,.3,1) forwards}

    .tc.reveal{animation:cardReveal .9s cubic-bezier(.18,1.1,.32,1) forwards}
    .tc.settled{animation:cardFloat 5s ease-in-out infinite}
    .tc .tc-shine{position:absolute;inset:0;z-index:6;border-radius:20px;pointer-events:none;opacity:0;
      background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%)}
    .tc.reveal .tc-shine{animation:shineSweep .75s .4s ease-out}
    .tc.reveal::after{content:"";position:absolute;inset:-4px;border-radius:24px;z-index:-1;
      box-shadow:0 0 0 0 rgba(232,59,78,.6);animation:glowRing 1.1s .45s ease-out}

    @keyframes holoDrift{0%,100%{transform:translateX(-30%)}50%{transform:translateX(30%)}}
    @keyframes packIdle{0%,100%{transform:translate(-50%,-50%) rotate(-1.2deg)}50%{transform:translate(-50%,calc(-50% - 9px)) rotate(1.6deg)}}
    @keyframes glowPulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.6;transform:scale(1.04)}}
    @keyframes foilSheen{0%{transform:translateX(-55%)}100%{transform:translateX(155%)}}
    @keyframes hintPulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes stageShake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,-2px)}60%{transform:translate(4px,4px)}80%{transform:translate(-2px,1px)}}
    @keyframes packCharge{0%,100%{transform:translate(-50%,-50%) scale(1) rotate(0)}
      25%{transform:translate(-50%,-50%) scale(1.07) rotate(-3.5deg)}
      55%{transform:translate(-50%,-50%) scale(.96) rotate(3.5deg)}
      80%{transform:translate(-50%,-50%) scale(1.09) rotate(-2deg)}}
    @keyframes faceGone{to{opacity:0;transform:scale(1.35)}}
    @keyframes stripFly{to{transform:translateY(-150px) rotate(26deg);opacity:0}}
    @keyframes tearRip{0%{width:0;opacity:1}72%{width:104%;opacity:1}100%{width:104%;opacity:0}}
    @keyframes peelL{to{transform:perspective(700px) rotateY(15deg)}}
    @keyframes peelR{to{transform:perspective(700px) rotateY(-15deg)}}
    @keyframes blowL{to{transform:perspective(700px) translateX(-155%) rotateY(58deg) rotateZ(-14deg);opacity:0;filter:blur(2px)}}
    @keyframes blowR{to{transform:perspective(700px) translateX(155%) rotateY(-58deg) rotateZ(14deg);opacity:0;filter:blur(2px)}}
    @keyframes flash{0%{opacity:.98;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(95)}}
    @keyframes shock{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(18)}}
    @keyframes rays{0%{opacity:.95;transform:translate(-50%,-50%) scale(.08) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(45deg)}}
    @keyframes confetti{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}
      100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--dr))}}
    @keyframes cardReveal{0%{opacity:0;transform:perspective(1300px) translateZ(-620px) rotateY(-330deg) scale(.46)}
      55%{opacity:1}
      82%{transform:perspective(1300px) translateZ(0) rotateY(13deg) scale(1.09)}
      100%{opacity:1;transform:perspective(1300px) rotateY(0) scale(1)}}
    @keyframes cardFloat{0%,100%{transform:perspective(1100px) translateY(0) rotateX(0)}50%{transform:perspective(1100px) translateY(-8px) rotateX(1.4deg)}}
    @keyframes shineSweep{0%{opacity:0;transform:translateX(-75%)}30%{opacity:1}100%{opacity:0;transform:translateX(75%)}}
    @keyframes glowRing{0%{box-shadow:0 0 0 0 rgba(232,59,78,.6)}100%{box-shadow:0 0 0 30px rgba(232,59,78,0)}}

    @media(prefers-reduced-motion:reduce){
      .pack,.pack-glow,.tc-holo::after,.pack-foil::after,.tc.settled{animation:none}
      .tc.reveal{animation:none}
    }
  </style>
</head>
<body>
  <header class="sport-header">
    <a href="index.html#teams" class="back-link" id="backLink">← Back to team</a>
    <a class="sport-brand" href="index.html"><img class="brand-logo" src="thumbnail.png" alt="Panther Press"><span><strong>PANTHER</strong><small>PRESS / CFHS ATHLETICS</small></span></a>
    <span class="season-label">2026-27 SEASON</span>
  </header>
  <main class="card-stage">
    <div class="card-col" id="playerMain">
      <p class="card-note">Loading player card…</p>
    </div>
  </main>
  <script src="stats-schema.js"></script>
  <script src="player.js"></script>
  <script src="cursor.js"></script>
</body>
</html>
