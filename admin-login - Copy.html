<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Access | Panther Press</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-shell"><a class="auth-brand" href="index.html"><img src="thumbnail.png" alt="Panther Press"><span><strong>PANTHER</strong><small>PRESS / CFHS ATHLETICS</small></span></a><section class="auth-card"><p class="eyebrow">RESTRICTED STAFF ACCESS</p><h1>Admin login</h1><p>Use the administrator password provided by Carolina Forest athletics. Regular accounts cannot access this area.</p><form id="adminLoginForm"><label>Admin password<input id="adminPassword" type="password" required placeholder="Enter admin password"></label><button class="auth-button" type="submit">Open admin dashboard</button></form><p id="adminMessage" class="message" role="status"></p><div id="invitePanel" hidden><hr><p class="eyebrow">ADMIN MANAGEMENT</p><h2>Add an administrator</h2><form id="inviteForm"><label>New admin email<input id="newAdminEmail" type="email" required placeholder="administrator@example.com"></label><button class="auth-button" type="submit">Add administrator</button></form><p id="inviteMessage" class="message" role="status"></p></div><div class="auth-links"><a href="auth.html">Regular login / signup</a><a href="index.html">Continue as guest</a></div></section></main><script>
const password = 'CFHS-2026!';
const loginForm = document.querySelector('#adminLoginForm');
loginForm.addEventListener('submit', event => { event.preventDefault(); if (document.querySelector('#adminPassword').value !== password) { document.querySelector('#adminMessage').textContent = 'Incorrect admin password.'; return; } localStorage.setItem('cfhs-admin-session', JSON.stringify({ role: 'Athletic Admin', email: 'authenticated-admin' })); document.querySelector('#invitePanel').hidden = false; document.querySelector('#adminMessage').textContent = 'Admin authenticated. Dashboard access granted.'; });
document.querySelector('#inviteForm').addEventListener('submit', event => { event.preventDefault(); const email = document.querySelector('#newAdminEmail').value.trim().toLowerCase(); const admins = JSON.parse(localStorage.getItem('cfhs-admins') || '[]'); if (!admins.includes(email)) admins.push(email); localStorage.setItem('cfhs-admins', JSON.stringify(admins)); document.querySelector('#inviteMessage').textContent = `${email} added to the admin directory.`; event.currentTarget.reset(); });
</script></body></html>
